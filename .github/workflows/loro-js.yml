name: loro.js

on:
  push:
    branches: ["main"]
    paths:
      - "loro-js/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/loro-js.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "loro-js/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/loro-js.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir loro-js check

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.100"
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir loro-js build:reference
      - run: pnpm --dir loro-js test:differential
